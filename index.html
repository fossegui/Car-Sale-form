<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Venda seu carro</title>
</head>
<body>
     <p class="outphrase">Cadastre seu veículo para vender mais rápido!</p>


<div class="divmom">

        <h1>Venda fácil seu carro</h1>

    <h2>Descreva as características e marque as opcionais que ele possui</h2>

    <form>
    <div>
        <label for="cartitle">Título do anúncio <span class="asterisk">*</span></label>
        <input type="text" id="cartitle" placeholder="Um título para anunciar seu carro" name="cartitle" minlength="1" maxlength="30" required>
    </div>

    <div>
        <label for="preço">Preço <span class="asterisk">*</span></label>
        <input type="number" name="preço" id="preço" placeholder="Defina o preço" required>
    </div>

    <div>
        <label for="áreadetexto">Descrição <span class="asterisk">*</span></label>
        <textarea name="áreadetexto" id="áreadetexto" required placeholder="Aqui você coloca os detalhes do veículo, por exemplo, se ele tem algum detalhe"></textarea>
    </div>

    <div>
        <label for="marca">Marca <span class="asterisk">*</span></label>
        <input type="text" name="marca" id="marca" required placeholder="Digite a marca do veículo">
    </div>

    <div>
        <label for="modelo">Modelo <span class="asterisk">*</span></label>
        <input type="text" name="modelo" id="modelo" required placeholder="Digite o modelo do veículo">
    </div>

    <div>
        <label for="km">Quilometragem <span class="asterisk">*</span></label>
        <input type="text" name="km" id="km" required placeholder ="Digite a quilometragem do veículo">
    </div>

    <div>
        <label for="data">Data de compra <span class="asterisk">*</span></label>
        <input type="date" name="data" id="data" required>
    </div>

    <div><p>Tipo de câmbio <span class="asterisk">*</span></p>
        <label for="manual">Manual</label>
        <input type="radio" id="manual" name="gear" required>
        <label for="automático">Automático</label>
        <input type="radio" id="automático" name="gear" required>
    </div>

    <div class="checkbox">
        <p class="opcional-p">Opcionais</p>
        <ul>
            <li>
                <input type="checkbox" name="optionals[]" value="airbag">
                <label for="airbag">Airbag</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="alarme">
                <label for="alarm">Alarme</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="arcondicionado">
                <label for="arcondicionado">Arcondicionado</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="cameraderé">
                <label for="cameraderé">Câmera de ré</label>
            </li>
        </ul>
    </div>

    <div class="checkbox">
        <ul>
            <li>
                <input type="checkbox" name="optionals[]" value="assistentedepista">
                <label for="assistentedepista">Assistente de pista</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="keyless">
                <label for="keyless">Partida Keyless</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="celular">
                <label for="celular">Integração com celular</label>
            </li>
             <li>
                <input type="checkbox" name="optionals[]" value="banco">
                <label for="banco">Banco de couro</label>
            </li>
        </ul>
    </div>
       
    

    <div>
        <label for="images">Fotos do carro <span class="asterisk">*</span></label>
        <input type="file" multiple accept="image/png, image/jpg" name="images" id="images">
    </div>

    
    <div class="botao-cadastro">
        <input type="submit" value="CADASTRAR">
    </div>
    </form>
    
</div>
    




</body>
</html>
